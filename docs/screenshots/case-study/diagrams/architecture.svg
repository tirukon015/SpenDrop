<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4fb2e0"/></marker>
  </defs>
  <rect width="1600" height="900" rx="16" fill="#0b0f14" stroke="rgba(233,240,244,0.09)"/>
  <text x="48" y="64" fill="#edf1f4" font-size="28" font-weight="600">SpenDrop: two targets, one on-device engine, one shared store</text>
  <text x="48" y="96" fill="#99a3ad" font-size="16">GitHub master d99b51f. No server, no network calls, no third-party packages: Apple frameworks only.</text>

  <!-- entry points -->
  <text x="48" y="150" fill="#4fb2e0" font-size="14" font-weight="600" letter-spacing="1.5">ENTRY POINTS</text>
  <rect x="48" y="168" width="360" height="130" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
  <text x="68" y="200" fill="#edf1f4" font-size="20" font-weight="600">SpenDropShare.appex</text>
  <text x="68" y="228" fill="#99a3ad" font-size="15">Share Extension: any app's share sheet</text>
  <text x="68" y="250" fill="#99a3ad" font-size="15">→ image in, review form out, within the</text>
  <text x="68" y="272" fill="#99a3ad" font-size="15">extension's memory limit</text>
  <rect x="48" y="318" width="360" height="130" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
  <text x="68" y="350" fill="#edf1f4" font-size="20" font-weight="600">SpenDrop.app</text>
  <text x="68" y="378" fill="#99a3ad" font-size="15">Photos picker, Quick Cash manual entry,</text>
  <text x="68" y="400" fill="#99a3ad" font-size="15">dashboard, history, analytics, PayBook,</text>
  <text x="68" y="422" fill="#99a3ad" font-size="15">settings, in-app self-test runner</text>

  <!-- engine -->
  <rect x="470" y="130" width="560" height="560" rx="12" fill="none" stroke="#4fb2e0" stroke-dasharray="8 5"/>
  <text x="490" y="162" fill="#4fb2e0" font-size="14" font-weight="600" letter-spacing="1.5">SHARED ENGINE (SAME SOURCE IN BOTH TARGETS)</text>
  <g>
    <rect x="490" y="180" width="520" height="84" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
    <text x="510" y="210" fill="#edf1f4" font-size="19" font-weight="600">Vision OCR</text>
    <text x="510" y="238" fill="#99a3ad" font-size="15">VNRecognizeTextRequest, image downsampled to 1280 px, rows sorted</text>
    <rect x="490" y="280" width="520" height="84" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
    <text x="510" y="310" fill="#edf1f4" font-size="19" font-weight="600">Amount candidates</text>
    <text x="510" y="338" fill="#99a3ad" font-size="15">every RM value labelled: total, fee, balance, cashback, advertisement</text>
    <rect x="490" y="380" width="520" height="84" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
    <text x="510" y="410" fill="#edf1f4" font-size="19" font-weight="600">Provider, merchant, category, date, reference</text>
    <text x="510" y="438" fill="#99a3ad" font-size="15">16 providers, sender vs recipient bank, 56 known merchants</text>
    <rect x="490" y="480" width="520" height="84" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
    <text x="510" y="510" fill="#edf1f4" font-size="19" font-weight="600">Duplicate detector</text>
    <text x="510" y="538" fill="#99a3ad" font-size="15">±48 h window: same reference, or same merchant + amount + day</text>
    <rect x="490" y="580" width="520" height="90" rx="10" fill="#10151c" stroke="#4fb2e0"/>
    <text x="510" y="612" fill="#edf1f4" font-size="19" font-weight="600">Review screen</text>
    <text x="510" y="640" fill="#99a3ad" font-size="15">the user confirms or edits every field; nothing is saved before</text>
  </g>
  <g stroke="#4fb2e0" stroke-width="2.5">
    <path d="M750 264 V274" marker-end="url(#a)"/><path d="M750 364 V374" marker-end="url(#a)"/>
    <path d="M750 464 V474" marker-end="url(#a)"/><path d="M750 564 V574" marker-end="url(#a)"/>
  </g>
  <path d="M408 233 H482" stroke="#4fb2e0" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M408 383 C445 383 445 222 482 222" stroke="#4fb2e0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- store -->
  <text x="1090" y="150" fill="#4fb2e0" font-size="14" font-weight="600" letter-spacing="1.5">ON THE DEVICE</text>
  <rect x="1090" y="168" width="462" height="170" rx="10" fill="#10151c" stroke="#4fb2e0" stroke-width="2"/>
  <text x="1110" y="200" fill="#edf1f4" font-size="20" font-weight="600">App Group shared store</text>
  <text x="1110" y="228" fill="#99a3ad" font-size="15">group.com.spenddrop.shared</text>
  <text x="1110" y="252" fill="#99a3ad" font-size="15">SwiftData: Expense, PayBookContact</text>
  <text x="1110" y="276" fill="#99a3ad" font-size="15">receipt JPEGs beside the database</text>
  <text x="1110" y="308" fill="#626b74" font-size="14">Read by both the app and the extension</text>
  <path d="M1010 625 C1060 625 1050 300 1082 300" stroke="#4fb2e0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="1044" y="470" fill="#99a3ad" font-size="14">save</text>
  <rect x="1090" y="360" width="462" height="110" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
  <text x="1110" y="392" fill="#edf1f4" font-size="19" font-weight="600">Dashboard, history, analytics</text>
  <text x="1110" y="420" fill="#99a3ad" font-size="15">today / week / month, search and filters,</text>
  <text x="1110" y="442" fill="#99a3ad" font-size="15">Swift Charts by category and provider</text>
  <rect x="1090" y="490" width="462" height="90" rx="10" fill="#10151c" stroke="rgba(233,240,244,0.16)"/>
  <text x="1110" y="522" fill="#edf1f4" font-size="19" font-weight="600">PayBook</text>
  <text x="1110" y="550" fill="#99a3ad" font-size="15">transfer payees, account numbers masked</text>
  <path d="M1321 338 V352" stroke="#4fb2e0" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- footer -->
  <rect x="48" y="730" width="1504" height="120" rx="10" fill="none" stroke="#626b74" stroke-dasharray="8 6"/>
  <text x="68" y="762" fill="#626b74" font-size="13" font-weight="700" letter-spacing="1.5">VERIFICATION AND GAPS</text>
  <text x="68" y="792" fill="#99a3ad" font-size="16">Recorded in the repository (25 Sep 2026, iPhone 17 Simulator, iOS 27.0): both targets build, 48 / 48 in-app parser and persistence tests pass.</text>
  <text x="68" y="818" fill="#99a3ad" font-size="16">Not re-run for this write-up (Windows machine). No XCTest target, no CI, no App Store or TestFlight build in the repository.</text>
</svg>
