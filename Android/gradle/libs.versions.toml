serialization = "1.11.0"
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
okhttp = "5.5.0"
coreKtx = "1.19.1"
splash = "1.2.0"
browser = "1.10.0"
work = "2.12.0"
datastore = "1.2.1"
mlkit = "16.0.1"
pdfbox = "2.0.27.0"
exif = "1.4.2"
